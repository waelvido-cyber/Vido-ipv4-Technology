<title>VIDO Technology – IPv4</title>
<style>
:root{--card:rgba(7,17,31,.84);--text:#f8fafc;--muted:#cbd5e1;--accent:#38bdf8;--ok:#4ade80;--bad:#fb7185;--border:rgba(255,255,255,.16);--shadow:0 24px 70px rgba(0,0,0,.32)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#020617 center/cover fixed no-repeat;transition:background-image 1s ease}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,rgba(14,165,233,.14),transparent 35%),linear-gradient(rgba(2,6,23,.20),rgba(2,6,23,.30));z-index:-1}
button,input,select{font:inherit}
button{color:inherit}
.wrap{max-width:1120px;margin:auto;padding:18px 14px 55px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
.brand{font-weight:950;letter-spacing:.18em;color:#22d3ee;font-size:13px}
.title{font-size:clamp(38px,7vw,62px);font-weight:950;line-height:.95;margin:7px 0}
.subtitle{color:var(--muted);font-weight:700}
.langs{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.langs button,.btn,.select,select,input{border:1px solid var(--border);border-radius:13px;background:rgba(15,30,48,.86);color:var(--text)}
.langs button{padding:8px 12px;cursor:pointer;font-weight:900}
.langs button.active{background:linear-gradient(135deg,#0891b2,#2563eb);border-color:#38bdf8;box-shadow:0 0 22px rgba(34,211,238,.22)}
.panel{transform-style:preserve-3d;transition:transform .2s ease,box-shadow .25s ease;background:var(--card);backdrop-filter:blur(13px);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:17px;margin-top:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{padding:14px;border-radius:14px;border:1px solid var(--border);background:rgba(22,39,60,.76);font-weight:950;cursor:pointer}
.tab.active{background:linear-gradient(135deg,rgba(8,145,178,.62),rgba(37,99,235,.70));border-color:#38bdf8;box-shadow:0 0 25px rgba(14,165,233,.12)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.field label{display:block;color:var(--muted);font-size:13px;font-weight:850;margin-bottom:7px}
.field select{width:100%;padding:12px 13px;outline:none}
.progress{height:9px;background:rgba(148,163,184,.14);border-radius:999px;overflow:hidden;margin-top:13px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#2563eb);transition:width .35s}
.question-panel{scroll-margin-top:12px}
.question-head{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:12px;font-weight:850}
.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:rgba(34,211,238,.13);color:#67e8f9;font-size:11px;font-weight:950}
.question{font-size:clamp(23px,3.6vw,38px);font-weight:950;line-height:1.22;margin:15px 0 10px}
.data-box{border:1px solid var(--border);border-radius:15px;padding:12px;background:rgba(0,0,0,.22);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#dbeafe;font-size:16px;direction:ltr;text-align:center}
.answer{margin-top:14px}
.answer input{width:100%;padding:15px;background:rgba(248,250,252,.97);color:#0f172a;font-weight:800;text-align:center;outline:none}
.answer input::placeholder{color:#64748b;opacity:1}
.choices{display:grid;gap:9px;margin-top:14px}
.choice{padding:14px;border:1px solid var(--border);background:rgba(18,35,54,.82);border-radius:13px;text-align:start;cursor:pointer;font-weight:850;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.choice:hover{transform:translateY(-2px) translateZ(10px);box-shadow:0 10px 24px rgba(14,165,233,.14)}
.choice.selected{border-color:#38bdf8;background:rgba(14,165,233,.19);box-shadow:0 0 22px rgba(14,165,233,.16)}
.choice.correct{border-color:rgba(74,222,128,.65);background:rgba(34,197,94,.15)}
.choice.wrong{border-color:rgba(251,113,133,.75);background:rgba(244,63,94,.16);animation:shake .34s ease}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
.btn{padding:13px 14px;position:relative;overflow:hidden;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;font-weight:950;cursor:pointer}
.btn:hover{transform:translateY(-2px) translateZ(8px);filter:brightness(1.08);box-shadow:0 10px 25px rgba(34,211,238,.13)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.primary{border:0;background:linear-gradient(135deg,#06b6d4,#2563eb)}
.btn.secondary{background:rgba(22,39,60,.74)}
.btn.danger{background:rgba(127,29,29,.35);border-color:rgba(251,113,133,.35)}
.feedback{margin-top:13px;padding:14px;border-radius:14px;font-weight:900;display:none}
.feedback.ok{display:block;animation:pop .35s ease;background:rgba(34,197,94,.13);border:1px solid rgba(74,222,128,.45);color:#bbf7d0}
.feedback.bad{display:block;animation:shake .35s ease;background:rgba(244,63,94,.14);border:1px solid rgba(251,113,133,.48);color:#fecdd3}
.solution{display:none;margin-top:12px;padding:14px;border-radius:14px;background:rgba(2,6,23,.48);border:1px solid var(--border)}
.solution.show{display:block}
.solution h3{margin:0 0 8px}
.step{padding:6px 0;color:#dbeafe}
.hint{display:none;margin-top:12px;padding:14px;border-radius:14px;background:rgba(14,165,233,.08);border:1px solid rgba(56,189,248,.28)}
.hint.show{display:block;animation:fade .25s ease}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.stat{border:1px solid var(--border);border-radius:14px;padding:11px;text-align:center;background:rgba(3,12,24,.43)}
.stat small{display:block;color:var(--muted);font-weight:750;font-size:11px}.stat strong{font-size:20px}
.summary{margin-top:14px}.summary-card{border:1px solid var(--border);border-radius:15px;padding:13px;margin-top:9px;background:rgba(2,6,23,.48)}
.summary-card.ok{border-color:rgba(74,222,128,.35)}.summary-card.bad{border-color:rgba(251,113,133,.42)}
.summary-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.summary-table th,.summary-table td{border-bottom:1px solid var(--border);padding:9px;text-align:start;vertical-align:top}
.summary-actions{margin-top:12px}
.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.roadmap button{min-height:78px;border:1px solid var(--border);border-radius:17px;background:linear-gradient(145deg,rgba(16,34,54,.88),rgba(5,15,28,.90));font-weight:900;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;position:relative}
.roadmap button:hover{transform:perspective(650px) rotateX(5deg) translateY(-3px);box-shadow:0 17px 34px rgba(0,0,0,.24);border-color:#38bdf8}
.roadmap button.coming-active{animation:pulseGlow .8s ease}
.coming{text-align:center;margin-top:10px;color:#67e8f9;font-weight:900;min-height:22px}
.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:18px}
.timer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#fde68a;font-size:17px;font-weight:900}
.mini{font-size:12px;color:var(--muted)}
.section-title{font-size:18px;font-weight:950;margin:0 0 6px}
.pill{display:inline-flex;gap:6px;align-items:center;padding:6px 9px;border-radius:999px;background:rgba(37,99,235,.12);border:1px solid rgba(56,189,248,.2);font-size:11px;font-weight:900}
.hidden{display:none!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.98)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 rgba(34,211,238,0)}50%{box-shadow:0 0 32px rgba(34,211,238,.24)}}
@media(max-width:760px){.grid,.actions{grid-template-columns:1fr}.roadmap{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.langs{justify-content:flex-start}.wrap{padding:15px 10px 40px}.question{font-size:25px}}
</style>
</head>

function tr(k){return T[state.lang][k]??k}
function ipNum(ip){return ip.split('.').reduce((n,o)=>(n*256)+Number(o),0)}
function numIp(n){return [24,16,8,0].map(s=>(n>>>s)&255).join('.')}
function validIp(ip){const a=ip.split('.');return a.length===4&&a.every(x=>/^\d+$/.test(x)&&+x>=0&&+x<=255)}
function network(ip,p){const n=ipNum(ip);const bits=p===0?0:(0xffffffff<<(32-p))>>>0;return numIp((n&bits)>>>0)}
function broadcast(ip,p){const n=ipNum(ip);const bits=p===0?0:(0xffffffff<<(32-p))>>>0;return numIp(((n&bits)>>>0)|(~bits>>>0))}
function maskFor(p){let a=[];for(let i=0;i<4;i++){const n=Math.max(0,Math.min(8,p-i*8));a.push(masks[n])}return a.join('.')}
function hosts(p){return p>=31?Math.pow(2,32-p):Math.max(0,Math.pow(2,32-p)-2)}
function block(p){const rem=p%8;return rem===0?256:256-masks[rem]}
function firstHost(ip,p){return p>=31?network(ip,p):numIp(ipNum(network(ip,p))+1)}
function lastHost(ip,p){return p>=31?broadcast(ip,p):numIp(ipNum(broadcast(ip,p))-1)}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function randIp(){return `${rand(10,223)}.${rand(0,254)}.${rand(0,254)}.${rand(1,254)}`}
function randPrefix(level){if(level==='easy')return rand(24,26);if(level==='mid')return rand(27,28);if(level==='hard')return rand(29,30);return rand(24,30)}
function prefixForHosts(h){for(let p=30;p>=0;p--)if(hosts(p)>=h)return p;return 0}
function normalize(s){return String(s??'').trim().replace(/\s+/g,'').replace(/[–—]/g,'-').toLowerCase()}
function classOf(ip){const x=+ip.split('.')[0];return x<=126?'A':x===127?'A (Loopback reserviert)':x<=191?'B':x<=223?'C':x<=239?'D':'E'}
function isPrivate(ip){const [a,b]=ip.split('.').map(Number);return a===10||(a===172&&b>=16&&b<=31)||(a===192&&b===168)}
function specialOf(ip){if(/^127\./.test(ip))return 'loopback';if(ip==='0.0.0.0')return 'unspecified';if(ip==='255.255.255.255')return 'broadcast';if(ip.startsWith('169.254.'))return 'linklocal';return 'public'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function makeQuestion(){
  const topic=state.topic==='all'?topicKeys[rand(1,topicKeys.length-1)]:state.topic;
  const p=randPrefix(state.level),ip=randIp(),n=network(ip,p),b=broadcast(ip,p),f=firstHost(ip,p),l=lastHost(ip,p),u=hosts(p),bs=block(p),mask=maskFor(p);
  let q={topic,ip,p,n,b,f,l,u,bs,mask,type:state.type,answers:[],data:'',rule:'',method:[]};

  if(topic==='network'){q.promptKey='network';q.answers=[n];q.ruleKey='network';q.method=[`Prefix /${p}`,`Subnet Mask ${mask}`,`Block Size ${bs}`,`Die kleinste Block-Grenze ≤ letztes Oktett bestimmen.`]}
  else if(topic==='broadcast'){q.promptKey='broadcast';q.answers=[b];q.ruleKey='broadcast';q.method=[`Network Address bestimmen`,`Nächste Block-Grenze bestimmen`,`1 von der nächsten Block-Grenze abziehen.`]}
  else if(topic==='first'){q.promptKey='first';q.answers=[f];q.ruleKey='first';q.method=[`Network Address bestimmen`,`1 addieren.`]}
  else if(topic==='last'){q.promptKey='last';q.answers=[l];q.ruleKey='last';q.method=[`Broadcast Address bestimmen`,`1 subtrahieren.`]}
  else if(topic==='range'){q.promptKey='range';q.answers=[`${f}-${l}`,`${f}–${l}`];q.ruleKey='range';q.method=[`Network Address bestimmen`,`Broadcast Address bestimmen`,`First Host = Network + 1`,`Last Host = Broadcast − 1`]}
  else if(topic==='usable'){q.promptKey='usable';q.answers=[String(u)];q.ruleKey='usable';q.method=[`Host-Bits = 32 − ${p}`,`Gesamtadressen = 2^${32-p}`,`Bei einem normalen Subnetz Network und Broadcast abziehen.`]}
  else if(topic==='block'){q.promptKey='block';q.answers=[String(bs)];q.ruleKey='block';q.method=[`/ ${p} in Subnet Mask umwandeln`,`Relevantes Oktett bestimmen`,`256 − Maskenwert berechnen.`]}
  else if(topic==='mask'){q.promptKey='mask';q.answers=[mask];q.ruleKey='mask';q.method=[`Prefix /${p} in 8-Bit-Gruppen aufteilen`,`Jedes vollständige Oktett = 255`,`Restliches Oktett aus der Bitanzahl bestimmen.`]}
  else if(topic==='subnets'){const newP=rand(p,30);q.newP=newP;q.data=`/${p} → /${newP}`;q.answers=[String(Math.pow(2,newP-p))];q.promptKey='subnets';q.ruleKey='subnets';q.method=[`Entliehene Bits = ${newP} − ${p}`,`2^(entliehene Bits) berechnen.`]}
  else if(topic==='hosts'){q.answers=[`${Math.pow(2,32-p)} / ${u}`];q.promptKey='hosts';q.ruleKey='hosts';q.method=[`Host-Bits = 32 − ${p}`,`Gesamtadressen = 2^(32 − Prefix)`,`Usable Hosts = Gesamtadressen − 2`]}
  else if(topic==='subnetting'){const newP=rand(Math.max(p,24),Math.min(30,p+3));q.newP=newP;q.answers=[`${Math.pow(2,newP-p)} / ${hosts(newP)}`];q.promptKey='subnetting';q.ruleKey='subnetting';q.method=[`Neue Prefix-Länge /${newP}`,`Entliehene Bits = ${newP} − ${p}`,`Subnets = 2^(entliehene Bits)`,`Usable Hosts = 2^(32 − ${newP}) − 2`]}
  else if(topic==='cidr'){q.answers=[`/${p}`];q.promptKey='cidr';q.ruleKey='cidr';q.data=mask;q.method=[`Subnet Mask in 8-Bit-Gruppen betrachten`,`Anzahl gesetzter Bits zählen.`]}
  else if(topic==='vlsm'){const req=[rand(30,90),rand(10,29),rand(2,9)].sort((a,b)=>b-a);q.req=req;q.ps=req.map(prefixForHosts);q.answers=[q.ps.map((x,i)=>`${req[i]}→/${x}`).join('|')];q.promptKey='vlsm';q.ruleKey='vlsm';q.method=[`Anforderungen von groß nach klein sortieren`,`Für jede Anforderung den kleinsten passenden Prefix wählen`,`Nächstes verfügbares Subnetz bestimmen.`]}
  else if(topic==='classes'){q.answers=[classOf(ip).split(' ')[0]];q.promptKey='classes';q.ruleKey='classes';q.method=[`Erstes Oktett ablesen`,`1–126 = A, 128–191 = B, 192–223 = C, 224–239 = D, 240–255 = E`]}
  else if(topic==='private'){q.x=randIp();q.answers=[isPrivate(q.x)?'Private':'Public'];q.promptKey='private';q.ruleKey='private';q.method=[`10.0.0.0/8 prüfen`,`172.16.0.0/12 prüfen`,`192.168.0.0/16 prüfen`,`Treffer = Private, sonst Public`]}
  else if(topic==='special'){const arr=['127.0.0.1','0.0.0.0','255.255.255.255','169.254.10.20'];q.x=arr[rand(0,arr.length-1)];q.answers=[specialOf(q.x)];q.promptKey='special';q.ruleKey='special';q.method=[`Adresse mit bekannten Sonderbereichen vergleichen`,`127.0.0.0/8 = Loopback`,`169.254.0.0/16 = Link-Local`,`255.255.255.255 = Limited Broadcast`]}
  else if(topic==='gateway'){q.g=`192.168.${rand(0,254)}.1`;q.h=`192.168.${rand(0,254)}.${rand(2,254)}`;q.h=q.h.replace(/^192\.168\.(\d+)\./,(_,x)=>`192.168.${x}.`);const oct=q.h.split('.')[2];q.g=`192.168.${oct}.1`;q.answers=[q.g];q.promptKey='gateway';q.ruleKey='gateway';q.method=[`Host und Gateway müssen im selben Subnetz liegen`,`Bei /24 ist das erste Gateway-Beispiel oft .1`,`Prüfen, ob beide Adressen im gleichen Netzwerk liegen.`]}
  else {q.promptKey='complete';q.answers=[`${n}|${b}|${f}|${l}|${u}`];q.ruleKey='complete';q.method=[`Network Address bestimmen`,`Broadcast Address bestimmen`,`First Host = Network + 1`,`Last Host = Broadcast − 1`,`Usable Hosts = 2^(32 − Prefix) − 2`]}
  if(state.type==='mc')q=toMC(q);
  else if(state.type==='fill')q.fill=true;
  return q;
}

function toMC(q){
  const correct=q.answers[0], vals=[];
  if(/^\d+$/.test(correct)){const n=+correct;vals.push(String(n),String(Math.max(0,n-1)),String(n+2),String(n+4))}
  else if(/^\/\d+$/.test(correct)){const n=+correct.slice(1);vals.push(correct,`/${Math.max(0,n-1)}`,`/${Math.min(30,n+1)}`,`/${Math.min(30,n+2)}`)}
  else if(validIp(correct)){vals.push(correct,network(q.ip,q.p),broadcast(q.ip,q.p),q.ip)}
  else if(correct.includes('-')){vals.push(correct,`${q.n}-${q.l}`,`${q.f}-${q.b}`,`${q.n}-${q.b}`)}
  else if(correct.includes('|')){vals.push(correct,`${q.n}|${q.f}|${q.l}|${q.u}`,`${q.b}|${q.f}|${q.l}|${q.u}`,`${q.n}|${q.b}|${q.f}|${q.u+2}`)}
  else {vals.push(correct,'A','B','C')}
  q.choices=[...new Set(vals)].slice(0,4);
  while(q.choices.length<4)q.choices.push(state.lang==='ar'?`الخيار ${q.choices.length+1}`:state.lang==='en'?`Option ${q.choices.length+1}`:`Option ${q.choices.length+1}`);
  q.choices.sort(()=>Math.random()-.5);
  return q;
}

function localQuestion(q){

  return {prompt,rule:L.rules[q.ruleKey]};

function solutionSteps(q){
  const l=state.lang;
  const steps=[];
  if(q.topic==='network'){steps.push(`1. ${q.mask}`,`2. Block Size = 256 − ${q.mask.split('.')[3]} = ${q.bs}.`,`3. ${l==='ar'?'حدّد أول حد للكتلة يقع عند أو قبل الـOctet الأخير.':l==='en'?'Find the block boundary at or below the last octet.':'Bestimme die Blockgrenze am letzten Oktett.'}`);steps.push(`4. ${l==='ar'?'النتيجة':l==='en'?'Result':'Ergebnis'}: ${q.n}`)}
  else if(q.topic==='broadcast'){steps.push(`1. ${l==='ar'?'أوجد Network Address أولًا.':l==='en'?'Find the Network Address first.':'Zuerst die Network Address bestimmen.'}`,`2. Block Size = ${q.bs}.`,`3. ${l==='ar'?'اطرح 1 من بداية الكتلة التالية.':l==='en'?'Subtract 1 from the next block boundary.':'1 von der nächsten Blockgrenze abziehen.'}`,`4. ${q.b}`)}
  else if(q.topic==='first'){steps.push(`1. ${q.n}`,`2. ${l==='ar'?'أضف 1.':l==='en'?'Add 1.':'1 addieren.'}`,`3. ${q.f}`)}
  else if(q.topic==='last'){steps.push(`1. ${q.b}`,`2. ${l==='ar'?'اطرح 1.':l==='en'?'Subtract 1.':'1 subtrahieren.'}`,`3. ${q.l}`)}
  else if(q.topic==='range'){steps.push(`1. ${q.n}`,`2. ${q.b}`,`3. ${q.f} – ${q.l}`)}
  else if(q.topic==='usable'){steps.push(`1. 32 − ${q.p} = ${32-q.p}`,`2. 2^${32-q.p} = ${Math.pow(2,32-q.p)}`,`3. ${Math.pow(2,32-q.p)} − 2 = ${q.u}`)}
  else if(q.topic==='block'){steps.push(`1. /${q.p} → ${q.mask}`,`2. 256 − ${q.mask.split('.').find(x=>x!=='255'&&x!=='0')||q.mask.split('.')[3]} = ${q.bs}`)}
  else if(q.topic==='mask'){steps.push(`1. /${q.p}`,`2. ${q.mask}`)}
  else if(q.topic==='subnets'){steps.push(`1. ${q.newP} − ${q.p} = ${q.newP-q.p}`,`2. 2^${q.newP-q.p} = ${q.answers[0]}`)}
  else if(q.topic==='hosts'){steps.push(`1. 2^(32 − ${q.p}) = ${Math.pow(2,32-q.p)}`,`2. ${Math.pow(2,32-q.p)} − 2 = ${q.u}`)}
  else if(q.topic==='subnetting'){steps.push(`1. ${q.newP} − ${q.p} = ${q.newP-q.p}`,`2. 2^${q.newP-q.p} = ${Math.pow(2,q.newP-q.p)}`,`3. 2^(32 − ${q.newP}) − 2 = ${hosts(q.newP)}`)}
  else if(q.topic==='cidr'){steps.push(`1. ${q.mask}`,`2. /${q.p}`)}
  else if(q.topic==='vlsm'){steps.push(`1. ${q.req.join(' → ')}`,`2. ${q.ps.map((x,i)=>q.req[i]+' → /'+x).join(' · ')}`)}
  else if(q.topic==='classes'){steps.push(`1. ${q.ip.split('.')[0]}`,`2. ${q.answers[0]}`)}
  else if(q.topic==='private'){steps.push(`1. 10.0.0.0/8`,`2. 172.16.0.0/12`,`3. 192.168.0.0/16`,`4. ${q.answers[0]}`)}
  else if(q.topic==='special'){steps.push(`1. ${q.x}`,`2. ${q.answers[0]}`)}
  else if(q.topic==='gateway'){steps.push(`1. ${q.h}/24`,`2. ${q.g}`)}
  else {steps.push(`1. Network Address = ${q.n}`,`2. Broadcast Address = ${q.b}`,`3. First Host = ${q.f}`,`4. Last Host = ${q.l}`,`5. Usable Hosts = ${q.u}`)}
  return steps;
}

function buildAnswer(q){
  if(q.type==='mc'){return `<div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${String.fromCharCode(65+i)}. ${escapeHtml(c)}</button>`).join('')}</div>`}
  return `<input id="answerInput" autocomplete="off" inputmode="text" placeholder="${escapeHtml(tr('placeholder'))}">`;
}

function renderQuestion(){
  const q=state.questions[state.index]; if(!q)return;
  const loc=localQuestion(q);
  els.questionNo.textContent=`${state.index+1}/${state.round}`;
  els.question.textContent=loc.prompt;
  els.answerArea.innerHTML=buildAnswer(q);
  els.feedback.className='feedback';els.feedback.textContent='';
  els.solution.className='solution';els.solution.innerHTML='';
  els.hintBox.className='hint';els.hintBox.innerHTML='';
  els.prev.disabled=state.index===0;els.next.disabled=state.index>=state.round-1;
  els.next.textContent=tr('next')+' →';els.prev.textContent='← '+tr('previous');
  els.modeBadge.textContent=state.mode==='exam'?tr('examMode'):tr('learnMode');
  const response=state.responses[state.index];
  if(q.type==='mc'){
    els.answerArea.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{if(state.responses[state.index]?.answered)return;state.selected=i;els.answerArea.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');pulse(b)});
  } else {
    const input=el('answerInput'); if(input)input.value=response?.raw||''; if(input)input.onkeydown=e=>{if(e.key==='Enter')checkAnswer()}
  }
  if(response?.answered)showStoredResponse(response,q);
  updateStats();updateProgress();
  setTimeout(()=>els.questionPanel.scrollIntoView({behavior:'smooth',block:'start'}),30);
}

function pulse(node){node.animate([{transform:'scale(.98)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:300,easing:'ease-out'})}

function getRawAnswer(){
  const q=state.questions[state.index];
  if(q.type==='mc'){const c=state.selected;return c==null?'':q.choices[c]}
  return el('answerInput')?.value||'';
}
function isCorrect(q,raw){
  const n=normalize(raw);
  if(!n)return false;
  return q.answers.some(a=>normalize(a)===n);
}
function checkAnswer(){
  const q=state.questions[state.index]; if(!q || state.responses[state.index]?.answered)return;
  const raw=getRawAnswer();
  if(!raw.trim()){els.feedback.className='feedback bad';els.feedback.textContent=state.lang==='ar'?'⚠️ اكتب إجابتك أولًا.':state.lang==='en'?'⚠️ Enter an answer first.':'⚠️ Bitte zuerst eine Antwort eingeben.';return}
  const ok=isCorrect(q,raw);
  state.attempts++;if(ok){state.correct++;state.streak++;state.xp+=10;localStorage.setItem('vidoXP',state.xp)}else{state.streak=0;saveMistake(q,raw)}
  state.responses[state.index]={answered:true,correct:ok,raw,selected:state.selected};
  renderQuestion();
  showStoredResponse(state.responses[state.index],q);
  updateStats();maybeFinish();
}
function showStoredResponse(r,q){
  if(q.type==='mc'){els.answerArea.querySelectorAll('.choice').forEach((b,i)=>{const v=q.choices[i];if(normalize(v)===normalize(q.answers[0]))b.classList.add('correct');if(r.selected===i&&!r.correct)b.classList.add('wrong')})}
  els.feedback.className='feedback '+(r.correct?'ok':'bad');els.feedback.textContent=r.correct?'✓ '+tr('correctMsg'):'✗ '+tr('wrongMsg');

    const loc=localQuestion(q);
    els.solution.className='solution show';
    els.solution.innerHTML=`<h3>📘 ${escapeHtml(tr('solution'))}</h3><div class="step"><b>${escapeHtml(tr('rule'))}:</b> ${escapeHtml(loc.rule)}</div>${solutionSteps(q).map(s=>`<div class="step">${escapeHtml(s)}</div>`).join('')}`;
  }
  if(!r.correct && state.mode==='exam')els.solution.className='solution';
  const inp=el('answerInput');if(inp){inp.disabled=true;inp.style.background=r.correct?'rgba(220,252,231,.96)':'rgba(254,226,226,.96)'}

  els.subtitle.textContent=tr('subtitle');els.learnTab.textContent='📘 '+tr('learn');els.examTab.textContent='⏱️ '+tr('exam');
  els.topicLabel.textContent=tr('topic');els.typeLabel.textContent=tr('type');els.levelLabel.textContent=tr('level');els.countLabel.textContent=tr('count');
  els.new.textContent='✨ '+tr('new');els.reset.textContent='🔄 '+tr('reset');els.mistakes.textContent='🧩 '+tr('mistakes');els.calc.textContent='🧮 '+tr('calc');
  els.correct.previousElementSibling.textContent=tr('correct');els.attempts.previousElementSibling.textContent=tr('attempts');els.rate.previousElementSibling.textContent=tr('rate');els.streak.previousElementSibling.textContent=tr('streak');els.xp.previousElementSibling.textContent=tr('xp');
  els.check.textContent='✓ '+tr('check');els.hint.textContent='💡 '+tr('hint');els.prev.textContent='← '+tr('previous');els.next.textContent=tr('next')+' →';
  els.modeBadge.textContent=state.mode==='exam'?tr('examMode'):tr('learnMode');els.roadmapTitle.textContent=tr('roadmapTitle');els.roadmapHint.textContent=tr('roadmapHint');els.footer.textContent=tr('footer');
  els.topic.innerHTML=topicKeys.map(k=>`<option value="${k}">${escapeHtml(T[state.lang].topics[k])}</option>`).join('');
  els.qtype.innerHTML=typeKeys.map(k=>`<option value="${k}">${escapeHtml(T[state.lang].types[k])}</option>`).join('');
  els.level.innerHTML=levelKeys.map(k=>`<option value="${k}">${escapeHtml(T[state.lang].levels[k])}</option>`).join('');
  els.topic.value=state.topic;els.qtype.value=state.type;els.level.value=state.level;els.count.value=String(state.round);
  document.querySelectorAll('.langs button').forEach(b=>{b.classList.toggle('active',b.dataset.lang===state.lang);b.onclick=()=>{state.lang=b.dataset.lang;localStorage.setItem('vidoLang',state.lang);ui();renderQuestion();}});
  els.learnTab.classList.toggle('active',state.mode==='learn');els.examTab.classList.toggle('active',state.mode==='exam');
  renderRoadmap();
}
function renderRoadmap(){
  els.roadmap.innerHTML=T[state.lang].roadmap.map((x,i)=>`<button type="button" data-road="${i}">✨<br>${escapeHtml(x)}</button>`).join('');
  els.roadmap.querySelectorAll('button').forEach(b=>b.onclick=()=>{b.classList.add('coming-active');els.coming.textContent=state.lang==='ar'?'🚀 قريبًا – سيتم تفعيل هذا المجال في إصدار قادم.':state.lang==='en'?'🚀 Coming soon – this area will be unlocked in a future version.':'🚀 Dieser Bereich wird in einer späteren Version freigeschaltet.';setTimeout(()=>b.classList.remove('coming-active'),900);pulse(b)});
}
els.learnTab.onclick=()=>{state.mode='learn';ui();buildRound()};
els.examTab.onclick=()=>{state.mode='exam';ui();buildRound()};
els.check.onclick=checkAnswer;els.hint.onclick=hint;els.prev.onclick=()=>loadQuestion(state.index-1);els.next.onclick=()=>loadQuestion(state.index+1);
els.new.onclick=()=>{state.questions[state.index]=makeQuestion();state.responses[state.index]=null;state.selected=null;renderQuestion()};
els.reset.onclick=reset;els.mistakes.onclick=showMistakes;els.calc.onclick=showCalc;els.closeModal.onclick=()=>els.modal.classList.remove('open');els.modal.onclick=e=>{if(e.target===els.modal)els.modal.classList.remove('open')};
els.topic.onchange=e=>{state.topic=e.target.value;buildRound()};els.qtype.onchange=e=>{state.type=e.target.value;buildRound()};els.level.onchange=e=>{state.level=e.target.value;buildRound()};els.count.onchange=e=>{state.round=+e.target.value;buildRound()};
ui();buildRound();

if(matchMedia('(pointer:fine)').matches){document.querySelectorAll('.panel').forEach(card=>{card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`perspective(900px) rotateX(${-y*1.2}deg) rotateY(${x*1.2}deg)`});card.addEventListener('pointerleave',()=>card.style.transform='')})}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
</script>
</body>
</html>
