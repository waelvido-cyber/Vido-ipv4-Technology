let lang=localStorage.getItem(LKEY+'.lang')||'de'; let state=JSON.parse(localStorage.getItem(LKEY+'.state')||'null')||{correct:0,attempts:0,notes:{},history:[],mastery:{network:70,broadcast:65,block:60,first:75,last:68,hosts:62},lastQuestion:null};
let navHistory=[]; let currentView='home'; let task=null; let locked=false; let exam=null;
const topics=[['network','Network Address'],['broadcast','Broadcast Address'],['block','Blockgröße'],['first','1. Host'],['last','Letzter Host'],['hosts','Nutzbare Hosts']];
function tr(k){return T[lang][k]||T.de[k]||k} function save(){localStorage.setItem(LKEY+'.state',JSON.stringify(state))} function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function maskFromPrefix(p){let m=[];for(let i=0;i<4;i++){let n=Math.max(0,Math.min(8,p-i*8));m.push(n===0?0:n===8?255:256-2**(8-n))}return m.join('.')} function ipToN(ip){return ip.split('.').reduce((n,o)=>(n*256+Number(o))>>>0,0)} function nToIp(n){return [24,16,8,0].map(s=>(n>>>s)&255).join('.')} function validIp(ip){let a=ip.split('.');return a.length===4&&a.every(x=>/^\d+$/.test(x)&&+x>=0&&+x<=255)}
function makeTask(){let p=24+Math.floor(Math.random()*7), block=2**(32-p), base=Math.floor(Math.random()*(256/block))*block, host=Math.min(254,base+1+Math.floor(Math.random()*Math.max(1,block-2))); let ip='192.168.'+(10+Math.floor(Math.random()*30))+'.'+host; let net=base,bcast=base+block-1; let mode=topics[Math.floor(Math.random()*topics.length)][0]; task={id:'IPV4-'+String(Math.floor(Math.random()*9000)+1000),ip,prefix:p,mask:maskFromPrefix(p),block,network:ip.split('.').slice(0,3).join('.')+'.'+net,broadcast:ip.split('.').slice(0,3).join('.')+'.'+bcast,first:ip.split('.').slice(0,3).join('.')+'.'+(net+1),last:ip.split('.').slice(0,3).join('.')+'.'+(bcast-1),hosts:Math.max(0,block-2),mode}; locked=false;state.lastQuestion=task;save();renderTrainer()}
function expected(){return task?task[task.mode]:''}
function explanation(){return `<div class="steps"><div class="step">1. Prefix: <b class="ip">/${task.prefix}</b></div><div class="step">2. Subnet Mask: <b class="ip">${task.mask}</b></div><div class="step">3. Block Size: <b class="ip">256 − ${task.mask.split('.')[3]} = ${task.block}</b></div><div class="step">4. Network: <b class="ip">${task.network}</b> → Broadcast: <b class="ip">${task.broadcast}</b></div><div class="step">5. Host Range: <b class="ip">${task.first} – ${task.last}</b></div></div>`}
function toggleNote(){if(!task)return;if(state.notes[task.id])delete state.notes[task.id];else state.notes[task.id]={id:task.id,ip:task.ip,prefix:task.prefix,mode:task.mode};save();renderTrainer()}
function checkAnswer(){if(locked)return;let v=$('answer').value.trim();state.attempts++;let ok=v===expected();if(ok){state.correct++;state.mastery[task.mode]=Math.min(100,(state.mastery[task.mode]||0)+3)}else state.mastery[task.mode]=Math.max(0,(state.mastery[task.mode]||0)-2);state.history.unshift({id:task.id,skill:task.mode,ok,time:Date.now()});state.history=state.history.slice(0,300);save();locked=true;renderTrainer(ok)}
function hintText(){return `<div class="help"><b>${tr('hint')}</b><div>${lang==='ar'?'حدد أولاً الـPrefix والـSubnet Mask. احسب Block Size، ثم حدد المجال الذي يقع فيه آخر Octet من الـIP.':'Bestimme zuerst Prefix und Subnetzmaske. Berechne die Blockgröße und ordne danach das letzte Oktett dem passenden Subnetzbereich zu.'}</div></div>`}
function renderTrainer(result){let t=task;if(!t){makeTask();return} let note=!!state.notes[t.id];let feedback=result===undefined?'':`<div class="feedback ${result?'ok':'bad'}"><b>${result?tr('correct'):tr('wrong')}</b><div>${result?tr('correct')+' ✓':`Richtige Antwort: <b class="ip">${expected()}</b>`}</div>${explanation()}</div>`; $('trainerView').innerHTML=`<div class="card"><div class="row"><div><div class="kicker">${tr('question')} • ${esc(t.id)}</div><div class="h1">IPv4 Subnetting</div></div><div class="spacer"></div><button id="noteBtn">${note?'⭐':'☆'} ${tr('note')}</button><button id="helpBtn">🆘 ${tr('help')}</button><button id="videoBtn">▶ ${tr('video')}</button></div><hr style="border-color:var(--border);border-width:1px 0 0;margin:14px 0"><div class="question">${lang==='ar'?'لديك عنوان IPv4 التالي. ما هو '+esc(T[lang][t.mode])+'؟':'Gegeben ist folgende IPv4-Adresse. Bestimme die '+esc(T[lang][t.mode]||T.de[t.mode])+'.'}</div><div class="target"><span class="ip">${t.ip}/${t.prefix}</span></div><div class="row"><span class="pill">${tr('data')}: <span class="ip">/${t.prefix}</span></span><span class="pill">Subnet Mask: <span class="ip">${t.mask}</span></span><span class="pill">Skill: ${esc(t.mode)}</span></div><div style="margin-top:14px" class="answerGrid"><input id="answer" class="input ip" placeholder="z. B. 192.168.10.64" ${locked?'disabled':''}><button class="primary" id="checkBtn" ${locked?'disabled':''}>${tr('check')}</button></div><div class="row" style="margin-top:10px"><button id="hintBtn">💡 ${tr('hint')}</button><button id="whyBtn">🧠 ${tr('why')}</button><button id="newBtn">↻ ${tr('newQ')}</button><div class="spacer"></div><span class="pill">${state.correct}/${state.attempts} • ${state.attempts?Math.round(state.correct/state.attempts*100):0}%</span></div><div id="assist" style="margin-top:10px"></div>${feedback}</div>`; $('noteBtn').onclick=toggleNote;$('helpBtn').onclick=()=>{$('assist').innerHTML=`<div class="help">${tr('helpText')}</div>`};$('hintBtn').onclick=()=>{$('assist').innerHTML=hintText()};$('whyBtn').onclick=()=>{$('assist').innerHTML=`<div class="help"><b>${tr('why')}</b>${explanation()}</div>`};$('videoBtn').onclick=()=>{$('assist').innerHTML=`<div class="card"><div class="kicker">${tr('video')}</div><div class="h2">${esc(T[lang][t.mode])}</div><p>${tr('videoText')}</p><div class="topic">🎥 Concept → Method → Example → Practice</div></div>`};$('checkBtn').onclick=checkAnswer;$('newBtn').onclick=makeTask}
function renderHome(){let avg=Object.values(state.mastery).reduce((a,b)=>a+b,0)/Object.keys(state.mastery).length; $('homeView').innerHTML=`<div class="card"><div class="kicker">VIDO Technology</div><div class="h1">${tr('welcome')}</div><p class="muted">IPv4 Trainer + Learning Engine + Network Simulator</p><div class="row"><button class="primary" id="continueBtn">▶ ${tr('continue')}</button><button id="simGo">🖧 ${tr('sim')}</button><button id="examGo">📝 ${tr('exam')}</button></div></div><div class="grid cols3" style="margin-top:14px"><div class="card"><div class="muted">${tr('mastery')}</div><div class="stat">${Math.round(avg)}%</div><div class="progress"><i style="width:${avg}%"></i></div></div><div class="card"><div class="muted">Questions</div><div class="stat">${state.attempts}</div><div class="muted">${state.correct} correct</div></div><div class="card"><div class="muted">⭐ ${tr('notes')}</div><div class="stat">${Object.keys(state.notes).length}</div></div></div><div class="card" style="margin-top:14px"><div class="h2">${tr('topics')}</div><div class="grid cols3">${topics.map(([k,n])=>`<div class="topic"><b>${esc(T[lang][k]||n)}</b><span class="muted">${state.mastery[k]||0}%</span><div class="progress" style="margin-top:7px"><i style="width:${state.mastery[k]||0}%"></i></div></div>`).join('')}</div></div>`;$('continueBtn').onclick=()=>go('trainer');$('simGo').onclick=()=>go('sim');$('examGo').onclick=()=>startExam()}
function renderLearn(){ $('learnView').innerHTML=`<div class="card"><div class="kicker">${tr('topics')}</div><div class="h1">IPv4 → Routing → Troubleshooting</div><p class="muted">كل مهارة ترتبط بدرس، مساعدة، فيديو، تدريب ومحاولة تحقق.</p><div class="list">${topics.map(([k,n],i)=>`<button data-skill="${k}"><b>${i+1}. ${esc(T[lang][k]||n)}</b><span class="muted"> — ${state.mastery[k]||0}%</span></button>`).join('')}</div></div><div class="card" style="margin-top:14px"><div class="h2">🎥 ${tr('video')}</div><p>${tr('videoText')}</p></div>`;document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{let k=b.dataset.skill;go('trainer');makeTask();task.mode=k;renderTrainer()})}
function renderProgress(){let avg=Object.values(state.mastery).reduce((a,b)=>a+b,0)/Object.keys(state.mastery).length;$('progressView').innerHTML=`<div class="card"><div class="kicker">${tr('progress')}</div><div class="h1">${tr('mastery')}: ${Math.round(avg)}%</div><div class="progress"><i style="width:${avg}%"></i></div><div class="grid cols2" style="margin-top:14px">${topics.map(([k,n])=>`<div class="topic"><b>${esc(T[lang][k]||n)}</b><span class="muted">${state.mastery[k]||0}%</span><div class="progress" style="margin-top:7px"><i style="width:${state.mastery[k]||0}%"></i></div></div>`).join('')}</div></div><div class="card" style="margin-top:14px"><div class="h2">Smart Error Analysis</div>${state.history.slice(0,10).map(x=>`<div class="row"><span class="pill">${x.ok?'✓':'✗'}</span><span class="ip">${esc(x.id)}</span><span>${esc(x.skill)}</span><span class="spacer"></span><span class="muted">${new Date(x.time).toLocaleDateString()}</span></div>`).join('')||'<span class="muted">Noch keine Daten.</span>'}</div>`}
function renderGlossary(){let terms=[['IPv4','32-bit logical address'],['Subnet Mask','trennt Network- und Host-Bits'],['CIDR','Prefix notation such as /24'],['Default Gateway','Router address used to leave the local subnet'],['Broadcast','destination for all hosts in a subnet'],['ARP','maps IPv4 address to MAC address']];$('glossaryView').innerHTML=`<div class="card"><div class="kicker">${tr('glossary')}</div><div class="h1">IT Smart Glossary</div><div class="list">${terms.map(t=>`<div class="topic"><b>${t[0]}</b><span class="muted">${t[1]}</span></div>`).join('')}</div></div>`}
function renderSearch(){ $('searchView').innerHTML=`<div class="card"><div class="kicker">${tr('search')}</div><div class="h1">${tr('searchQ')}</div><input id="searchInput" class="input" placeholder="IPV4-1234"><div id="searchResults" class="searchResults"></div></div>`;$('searchInput').oninput=()=>{let q=$('searchInput').value.trim().toLowerCase();$('searchResults').innerHTML=q?`<button class="list" id="resultBtn">${state.lastQuestion&&state.lastQuestion.id.toLowerCase().includes(q)?'🔎 '+state.lastQuestion.id+' — '+state.lastQuestion.ip+'/'+state.lastQuestion.prefix:'Keine passende aktuelle Frage gefunden.'}</button>`:'';if($('resultBtn'))$('resultBtn').onclick=()=>{task=state.lastQuestion;go('trainer');renderTrainer()}}}
function renderNotes(){let ns=Object.values(state.notes);$('notesView').innerHTML=`<div class="card"><div class="kicker">⭐ ${tr('notes')}</div><div class="h1">${tr('notes')}</div><div class="list">${ns.map(n=>`<button data-note="${n.id}">⭐ <span class="ip">${n.ip}/${n.prefix}</span> — ${esc(T[lang][n.mode]||n.mode)}</button>`).join('')||'<span class="muted">Keine Notizen.</span>'}</div></div>`;document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{task=state.lastQuestion&&state.lastQuestion.id===b.dataset.note?state.lastQuestion:null;if(!task){let n=state.notes[b.dataset.note];task={...n,mask:maskFromPrefix(n.prefix),block:2**(32-n.prefix),network:n.ip.split('.').slice(0,3).join('.')+'.0',broadcast:n.ip.split('.').slice(0,3).join('.')+'.255',first:'',last:'',hosts:''} }go('trainer');renderTrainer()})}
let sim={nodes:[],links:[],selected:null};
function addNode(type){let id=type.toUpperCase()+(sim.nodes.filter(n=>n.type===type).length+1);sim.nodes.push({id,type,x:30+sim.nodes.length*150,y:90+((sim.nodes.length%2)*150),ip:'',mask:'/24',gateway:''});sim.selected=id;renderSim()}
function renderSim(){let nodes=sim.nodes.map(n=>{let icon=n.type==='pc'?'💻':n.type==='switch'?'🔀':'🛜';return `<div class="node ${sim.selected===n.id?'selected':''}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="ico">${icon}</div><b>${n.id}</b><div class="small muted ip">${n.ip||'no IPv4'}</div></div>`}).join('');let links=sim.links.map(l=>{let a=sim.nodes.find(n=>n.id===l.a),b=sim.nodes.find(n=>n.id===l.b);if(!a||!b)return '';let dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `<div class="link" style="left:${a.x+58}px;top:${a.y+48}px;width:${len}px;transform:rotate(${ang}deg)"></div>`}).join('');let selected=sim.nodes.find(n=>n.id===sim.selected);$('simView').innerHTML=`<div class="card"><div class="kicker">${tr('simTitle')}</div><div class="h1">${tr('simTitle')}</div><p class="muted">${tr('simHelp')}</p><div class="sim"><div><div class="devices"><button id="addPC">💻 ${tr('addPC')}</button><button id="addSwitch">🔀 ${tr('addSwitch')}</button><button id="addRouter">🛜 ${tr('addRouter')}</button><button id="connect">🔗 Connect selected</button><button id="pingBtn">📡 ${tr('ping')}</button><button id="resetSim">↺ ${tr('clear')}</button></div>${selected?`<div class="card" style="margin-top:10px;padding:12px"><b>${selected.id}</b><label class="label">IPv4</label><input id="simIp" class="input ip" value="${esc(selected.ip)}" placeholder="192.168.10.10"><label class="label" style="margin-top:8px">Prefix</label><select id="simPrefix" class="input">${Array.from({length:7},(_,i)=>24+i).map(p=>`<option ${selected.mask==='/'+p?'selected':''}>/${p}</option>`).join('')}</select><label class="label" style="margin-top:8px">Gateway</label><input id="simGw" class="input ip" value="${esc(selected.gateway)}" placeholder="192.168.10.1"><button id="applySim" class="primary" style="margin-top:8px">${tr('save')}</button></div>`:''}</div><div><div class="canvas" id="canvas">${links}${nodes}</div><div class="console" id="console">${tr('status')}: ${sim.nodes.length} device(s), ${sim.links.length} link(s).\nReady.</div></div></div></div>`;document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{sim.selected=b.dataset.node;renderSim()});$('addPC').onclick=()=>addNode('pc');$('addSwitch').onclick=()=>addNode('switch');$('addRouter').onclick=()=>addNode('router');$('resetSim').onclick=()=>{sim={nodes:[],links:[],selected:null};renderSim()};$('connect').onclick=()=>{if(sim.nodes.length<2)return;let ids=sim.nodes.map(n=>n.id);let a=sim.selected||ids[ids.length-1],b=ids.find(x=>x!==a);if(b&&!sim.links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a)))sim.links.push({a,b});renderSim()};$('applySim')?.addEventListener('click',()=>{selected.ip=$('simIp').value.trim();selected.mask=$('simPrefix').value;selected.gateway=$('simGw').value.trim();renderSim()});$('pingBtn').onclick=pingSim}
function pingSim(){let pcs=sim.nodes.filter(n=>n.type==='pc');let c=$('console');if(pcs.length<2){c.textContent='Need two PCs.';return}let a=pcs[0],b=pcs[1];if(!validIp(a.ip)||!validIp(b.ip)){c.textContent=tr('invalid');return}let pa=Number(a.mask.slice(1)),pb=Number(b.mask.slice(1));if(pa!==pb){c.textContent='❌ Prefix mismatch for this basic lab.';return}let mask=ipToN(maskFromPrefix(pa));let na=ipToN(a.ip)&mask,nb=ipToN(b.ip)&mask;c.textContent=na===nb?'✓ '+tr('connected')+'\n'+tr('sameSubnet')+': '+nToIp(na)+'/'+pa:'✗ '+tr('differentSubnet')+'\n'+tr('noRoute')+'\nNetwork A: '+nToIp(na)+'/'+pa+'\nNetwork B: '+nToIp(nb)+'/'+pa}
function startExam(){go('trainer');let end=Date.now()+30*60*1000;exam={end};task={...task,mode:'network'};renderTrainer();let tick=setInterval(()=>{if(!exam)return clearInterval(tick);if(Date.now()>=exam.end){clearInterval(tick);exam=null;alert('IHK Exam Mode beendet.');}else{let m=Math.floor((exam.end-Date.now())/60000),s=Math.floor((exam.end-Date.now())/1000)%60;let el=document.querySelector('.pill');if(el)el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}},1000)}
const views=['home','learn','trainer','sim','progress','glossary','search','notes']; function nav(){let labels={home:tr('home'),learn:tr('learn'),trainer:tr('trainer'),sim:tr('sim'),progress:tr('progress'),glossary:tr('glossary'),search:tr('search'),notes:tr('notes')};$('nav').innerHTML=views.map(v=>`<button data-nav="${v}" class="${currentView===v?'active':''}">${labels[v]}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav))}
function render(){document.documentElement.dir=lang==='ar'?'rtl':'ltr';nav();renderHome();renderLearn();renderProgress();renderGlossary();renderSearch();renderNotes();if(!task)makeTask();else renderTrainer();renderSim();views.forEach(v=>$(v+'View').classList.toggle('active',v===currentView));$('backBtn').textContent='← '+tr('back')}
function go(v){if(v===currentView)return;navHistory.push(currentView);currentView=v;render()}
$('backBtn').onclick=()=>{if(navHistory.length){currentView=navHistory.pop();render()}};$('lang').value=lang;$('lang').onchange=()=>{lang=$('lang').value;localStorage.setItem(LKEY+'.lang',lang);render()};
render();
</script></body></html>
