const topicKeys=Object.keys(T.de.topics); const typeKeys=Object.keys(T.de.types); const levelKeys=Object.keys(T.de.levels);
const masks={0:0,1:128,2:192,3:224,4:240,5:248,6:252,7:254,8:255};
function maskFor(p){let a=[];for(let i=0;i<4;i++){let n=Math.max(0,Math.min(8,p-i*8));a.push(masks[n]);}return a.join('.')}
function ipNum(ip){return ip.split('.').reduce((n,o)=>(n*256)+Number(o),0)}
function numIp(n){return [24,16,8,0].map(s=>(n>>>s)&255).join('.')}
function validIp(ip){const a=ip.split('.');return a.length===4&&a.every(x=>/^\d+$/.test(x)&&+x>=0&&+x<=255)}
function network(ip,p){const n=ipNum(ip);const bits=p===0?0:(0xffffffff<<(32-p))>>>0;return numIp((n&bits)>>>0)}
function broadcast(ip,p){const n=ipNum(ip);const bits=p===0?0:(0xffffffff<<(32-p))>>>0;return numIp(((n&bits)>>>0)|(~bits>>>0))}
function hosts(p){return p===31?2:p===32?1:Math.max(0,2**(32-p)-2)}
function block(p){const oct=Math.floor(p/8), rem=p%8;return rem===0?256:256-masks[rem]}
function prefixForHosts(h){for(let p=30;p>=0;p--)if(hosts(p)>=h)return p;return 0}
function firstHost(ip,p){return p>=31?network(ip,p):numIp(ipNum(network(ip,p))+1)}
function lastHost(ip,p){return p>=31?broadcast(ip,p):numIp(ipNum(broadcast(ip,p))-1)}
function classOf(ip){const x=+ip.split('.')[0];return x<=127?'A':x<=191?'B':x<=223?'C':x<=239?'D':'E'}
function isPrivate(ip){const [a,b]=ip.split('.').map(Number);return a===10||(a===172&&b>=16&&b<=31)||(a===192&&b===168)}
function isSpecial(ip){const n=ipNum(ip);return ip==='127.0.0.1'||ip==='0.0.0.0'||ip==='255.255.255.255'||(n>=ipNum('169.254.0.0')&&n<=ipNum('169.254.255.255'))}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function randIp(p){return `${rand(10,223)}.${rand(0,254)}.${rand(0,254)}.${rand(1,254)}`}
function randPrefix(level){if(level==='easy')return rand(24,26);if(level==='mid')return rand(27,28);if(level==='hard')return rand(29,30);return rand(24,30)}
function fmtIP(ip,p){return `${ip}/${p}`}

const labels={network:'Network Address',broadcast:'Broadcast Address',first:'First Host',last:'Last Host',range:'Host Range',usable:'Usable Hosts',block:'Block Size',mask:'Subnet Mask ↔ Prefix',subnets:'Number of Subnets',hosts:'Number of Hosts',subnetting:'Subnetting',cidr:'CIDR',vlsm:'VLSM',classes:'IP Address Classes',private:'Private / Public IP',special:'Special Addresses',gateway:'Default Gateway',complete:'Complete Subnetting Task'};
function qCalc(topic,level){const p=randPrefix(level);const ip=randIp(p);const n=network(ip,p),b=broadcast(ip,p),f=firstHost(ip,p),l=lastHost(ip,p),u=hosts(p),bs=block(p),mask=maskFor(p);const base=topic==='all'?Object.keys(labels)[rand(0,Object.keys(labels).length-1)]:topic;
let q={topic:base,kind:base,type:'direct',prompt:'',data:fmtIP(ip,p),answers:[],steps:[],meta:{ip,p,n,b,f,l,u,bs,mask}};
if(base==='network'){q.prompt=`Was ist die Network Address von ${fmtIP(ip,p)}?`;q.answers=[n];q.steps=[`Prefix: /${p}`,`Subnet Mask: ${mask}`,`Block Size: ${bs}`,`Network Address: ${n}`]}
else if(base==='broadcast'){q.prompt=`Was ist die Broadcast Address von ${fmtIP(ip,p)}?`;q.answers=[b];q.steps=[`Network Address: ${n}`,`Broadcast Address: ${b}`]}
else if(base==='first'){q.prompt=`Was ist der First Host von ${fmtIP(ip,p)}?`;q.answers=[f];q.steps=[`Network Address: ${n}`,`First Host = Network + 1 → ${f}`]}
else if(base==='last'){q.prompt=`Was ist der Last Host von ${fmtIP(ip,p)}?`;q.answers=[l];q.steps=[`Broadcast Address: ${b}`,`Last Host = Broadcast − 1 → ${l}`]}
else if(base==='range'){q.prompt=`Gib den Host Range für ${fmtIP(ip,p)} an.`;q.answers=[`${f} - ${l}`,`${f}–${l}`];q.steps=[`Network: ${n}`,`Broadcast: ${b}`,`Host Range: ${f} - ${l}`]}
else if(base==='usable'){q.prompt=`Wie viele Usable Hosts hat ${fmtIP(ip,p)}?`;q.answers=[String(u)];q.steps=[`2^(32-${p}) = ${2**(32-p)} Adressen`,`2 reserviert für Network + Broadcast`,`Usable Hosts = ${u}`]}
else if(base==='block'){q.prompt=`Wie groß ist die Block Size bei ${fmtIP(ip,p)}?`;q.answers=[String(bs)];q.steps=[`Prefix: /${p}`,`Relevantes Oktett: ${Math.floor(p/8)+1}`,`Block Size = 256 − Maskenwert → ${bs}`]}
else if(base==='mask'){q.prompt=`Welche Subnet Mask gehört zu ${fmtIP(ip,p)}?`;q.answers=[mask];q.steps=[`/${p} = ${mask}`]}
else if(base==='subnets'){const newP=rand(p,30);const count=2**(newP-p);q.meta.newP=newP;q.meta.count=count;q.data=`${n}/${p} → Aufteilung in /${newP}`;q.prompt=`Wie viele Subnetze entstehen?`;q.answers=[String(count)];q.steps=[`Entliehene Bits: ${newP-p}`,`Subnetze = 2^${newP-p} = ${count}`]}
else if(base==='hosts'){q.meta.total=2**(32-p);q.prompt=`Wie viele Host-Adressen gibt es bei ${fmtIP(ip,p)} insgesamt und wie viele sind nutzbar?`;q.answers=[`${2**(32-p)} / ${u}`,`${2**(32-p)}; ${u}`];q.steps=[`Gesamtadressen: 2^(32-${p}) = ${2**(32-p)}`,`Nutzbar: ${u}`]}
else if(base==='subnetting'){const newP=rand(Math.max(p,24),Math.min(30,p+3));const sn=2**(newP-p),hu=hosts(newP);q.meta.newP=newP;q.meta.sn=sn;q.meta.hu=hu;q.data=`Netz: ${n}/${p} → neue Prefix-Länge /${newP}`;q.prompt=`Wie viele gleich große Subnetze entstehen und wie viele Usable Hosts hat jedes Subnetz?`;q.answers=[`${sn} / ${hu}`];q.steps=[`Entliehene Bits: ${newP-p}`,`Subnetze: ${sn}`,`Usable Hosts je Subnetz: ${hu}`]}
else if(base==='cidr'){q.prompt=`Welcher Prefix entspricht der Subnet Mask ${mask}?`;q.data=`Subnet Mask: ${mask}`;q.answers=[`/${p}`,String(p)];q.steps=[`${mask} entspricht /${p}`]}
else if(base==='vlsm'){const req=[rand(10,60),rand(5,25),rand(2,10)].sort((a,b)=>b-a);const ps=req.map(prefixForHosts);q.meta.req=req;q.meta.ps=ps;q.data=`Anforderungen: ${req.join(', ')} Hosts`;q.prompt='Ordne den Anforderungen den jeweils kleinsten passenden Prefix zu (größte Anforderung zuerst).';q.answers=[ps.map((x,i)=>`${req[i]}→/${x}`).join(' | ')];q.steps=[`Sortiert: ${req.join(', ')}`,`Kleinste Prefixe: ${ps.map((x,i)=>req[i]+'→/'+x).join(', ')}`]}
else if(base==='classes'){const c=classOf(ip);q.meta.cls=c;q.prompt=`Zu welcher IPv4 Address Class gehört ${ip}?`;q.answers=[c];q.steps=[`Erstes Oktett: ${ip.split('.')[0]}`,`Class ${c}`]}

function reset(){startRound()}
function showMistakes(){modal.classList.add('open');modalTitle.textContent=tr('mistakes');modalBody.innerHTML=state.mistakes.length?state.mistakes.map((m,i)=>`<div class="mistake"><b>${i+1}. ${m.prompt}</b><div class="small">${m.data||''}</div><div>✓ ${m.answer}</div></div>`).join(''):`<p>${tr('mistakeEmpty')}</p>`}
function showCalc(){modal.classList.add('open');modalTitle.textContent=tr('calcTitle');modalBody.innerHTML=`<div class="field"><label>${tr('calcIp')}</label><input id="calcInput" value="192.168.1.25/27" class="ltr"></div><div class="actions"><button class="btn primary" id="calcGo">${tr('calcGo')}</button></div><div id="calcResult" class="solution show" style="margin-top:12px"></div>`;document.getElementById('calcGo').onclick=()=>{const v=document.getElementById('calcInput').value.trim();const m=v.match(/^([0-9.]+)\/(\d{1,2})$/);const out=document.getElementById('calcResult');if(!m||!validIp(m[1])||+m[2]>32){out.textContent=tr('invalid');return}const p=+m[2],ip=m[1];out.innerHTML=`<div class="step"><b>Network Address:</b> ${network(ip,p)}</div><div class="step"><b>Broadcast Address:</b> ${broadcast(ip,p)}</div><div class="step"><b>First Host:</b> ${firstHost(ip,p)}</div><div class="step"><b>Last Host:</b> ${lastHost(ip,p)}</div><div class="step"><b>Host Range:</b> ${firstHost(ip,p)} - ${lastHost(ip,p)}</div><div class="step"><b>Usable Hosts:</b> ${hosts(p)}</div><div class="step"><b>Subnet Mask:</b> ${maskFor(p)}</div><div class="step"><b>Block Size:</b> ${block(p)}</div>`}}
function tick(){if(state.mode!=='exam'||state.examSeconds<=0)return;state.examSeconds--;timer.textContent=`${Math.floor(state.examSeconds/60).toString().padStart(2,'0')}:${(state.examSeconds%60).toString().padStart(2,'0')}`;if(state.examSeconds===0){finishRound();feedback.className='feedback bad';feedback.textContent=tr('timeUp')}}setInterval(tick,1000);

document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;localStorage.setItem('vidoLang',state.lang);ui()});learnTab.onclick=()=>{state.mode='learn';learnTab.classList.add('active');examTab.classList.remove('active');ui();startRound()};examTab.onclick=()=>{state.mode='exam';examTab.classList.add('active');learnTab.classList.remove('active');ui();startRound()};checkBtn2.onclick=check;hintBtn2.onclick=hint;newBtn.onclick=()=>{state.index=Math.min(state.index+1,state.round-1);nextQuestion()};resetBtn.onclick=reset;mistakesBtn.onclick=showMistakes;calcBtn.onclick=showCalc;closeModal.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};topic.onchange=e=>{state.topic=e.target.value;startRound()};qtype.onchange=e=>{state.type=e.target.value;startRound()};level.onchange=e=>{state.level=e.target.value;startRound()};count.onchange=e=>{state.round=+e.target.value;startRound()};
ui();startRound();
</script>
</body>
</html>
